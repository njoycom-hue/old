name: Android CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run unit tests
        run: ./gradlew test --stacktrace

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      # Only push events (not PRs) publish, and only the "latest" release/tag is kept —
      # each run deletes the previous one before creating a new one, so old APKs don't pile up.
      - name: Publish latest release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest app/build/outputs/apk/debug/app-debug.apk \
            --title "최신 빌드 (${GITHUB_SHA::7})" \
            --notes "커밋 ${GITHUB_SHA} 기준 자동 빌드 (디버그 APK). 브랜치: ${GITHUB_REF_NAME}" \
            --target "$GITHUB_SHA"
