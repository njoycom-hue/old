<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>두뇌톡톡 - 치매예방 두뇌 게임</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">

  <header class="top-bar">
    <button id="back-btn" class="back-btn hidden" aria-label="홈으로">← 홈으로</button>
    <h1 id="page-title">두뇌톡톡</h1>
  </header>

  <main>

    <!-- 홈 화면 -->
    <section id="screen-home" class="screen">
      <p class="intro">매일 조금씩, 즐겁게 두뇌를 움직여 보세요.<br>치매 예방에 도움이 되는 두뇌 게임 4가지를 준비했어요.</p>
      <div class="card-grid">
        <button class="game-card" data-game="memory">
          <span class="card-emoji">🃏</span>
          <span class="card-title">기억력 카드 짝맞추기</span>
          <span class="card-desc">같은 그림 카드를 찾아보세요</span>
          <span class="card-best" data-best="memory">최고 기록: -</span>
        </button>
        <button class="game-card" data-game="sequence">
          <span class="card-emoji">🔵</span>
          <span class="card-title">순서 기억하기</span>
          <span class="card-desc">불이 켜진 순서를 똑같이 눌러보세요</span>
          <span class="card-best" data-best="sequence">최고 기록: -</span>
        </button>
        <button class="game-card" data-game="math">
          <span class="card-emoji">➕</span>
          <span class="card-title">빠른 암산</span>
          <span class="card-desc">간단한 계산 문제를 풀어보세요</span>
          <span class="card-best" data-best="math">최고 기록: -</span>
        </button>
        <button class="game-card" data-game="word">
          <span class="card-emoji">🍎</span>
          <span class="card-title">다른 것 찾기</span>
          <span class="card-desc">어울리지 않는 낱말을 찾아보세요</span>
          <span class="card-best" data-best="word">최고 기록: -</span>
        </button>
      </div>
    </section>

    <!-- 기억력 카드 짝맞추기 -->
    <section id="screen-memory" class="screen hidden">
      <div class="status-row">
        <span id="memory-moves">시도 횟수: 0</span>
        <span id="memory-timer">시간: 0초</span>
      </div>
      <div id="memory-board" class="memory-board"></div>
      <p id="memory-message" class="message"></p>
      <button class="primary-btn" id="memory-restart">다시 시작</button>
    </section>

    <!-- 순서 기억하기 -->
    <section id="screen-sequence" class="screen hidden">
      <div class="status-row">
        <span id="sequence-round">라운드: 1</span>
        <span id="sequence-best">최고 기록: 0</span>
      </div>
      <p id="sequence-message" class="message">시작 버튼을 누르면 순서가 나와요</p>
      <div class="sequence-board" id="sequence-board">
        <button class="seq-btn" data-color="0"></button>
        <button class="seq-btn" data-color="1"></button>
        <button class="seq-btn" data-color="2"></button>
        <button class="seq-btn" data-color="3"></button>
      </div>
      <button class="primary-btn" id="sequence-start">시작</button>
    </section>

    <!-- 빠른 암산 -->
    <section id="screen-math" class="screen hidden">
      <div class="status-row">
        <span id="math-progress">문제: 1 / 10</span>
        <span id="math-score">맞은 개수: 0</span>
      </div>
      <p id="math-question" class="question">-</p>
      <div id="math-choices" class="choice-grid"></div>
      <p id="math-result" class="message"></p>
    </section>

    <!-- 다른 것 찾기 -->
    <section id="screen-word" class="screen hidden">
      <div class="status-row">
        <span id="word-progress">문제: 1 / 10</span>
        <span id="word-score">맞은 개수: 0</span>
      </div>
      <p class="question">어울리지 않는 낱말은 무엇일까요?</p>
      <div id="word-choices" class="choice-grid"></div>
      <p id="word-result" class="message"></p>
    </section>

  </main>
</div>
<script src="js/app.js"></script>
</body>
</html>
